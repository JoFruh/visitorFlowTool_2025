  <polyline points="17 28 17 20 7 20 7 28"/>
  <!-- the arrow: one filled shape, tip at the top of the box -->
  <polygon points="12 0.75 18.5 7 14.25 7 14.25 17 9.75 17 9.75 7 5.5 7"
           fill="#ffffff" stroke-width="1"/>
</svg>
